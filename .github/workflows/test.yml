name: 整理器验证

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 运行批次和页面入口测试
        run: npm test
  upstream-rescan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nashsu/llm_wiki
          ref: e8082119649e6a8e1cf85eaf289adcabfdf39d4e
          path: .upstream
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 校验并准备固定上游扫描源码
        run: node scripts/upstream-rescan/prepare.mjs .upstream "$RUNNER_TEMP/organizer-rescan"
      - name: 验证真实文件扫描与变更队列
        run: cargo test --locked --manifest-path "$RUNNER_TEMP/organizer-rescan/Cargo.toml"
