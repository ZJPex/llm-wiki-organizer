<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>完整恢复备份</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/">返回兼容预检</a><h1>创建完整恢复备份</h1><p>保存原库完整状态，随后创建独立验证副本。所有目标必须在原库之外，父目录应已存在，目标目录必须尚不存在。</p><form id="backup-form"><label>原库绝对路径<input required name="libraryPath"></label><label>Wiki 源码目录<input required name="wikiSourcePath"></label><label>恢复备份新目录<input required name="backupPath"></label><label>验证副本新目录<input required name="validationPath"></label><label class="check"><input type="checkbox" name="writersPaused" required>已停止 Wiki、Obsidian、同步程序等全部写入，并保持停止直到备份完成</label><p>哈希核验不能替代停止外部写入。检测到未收尾的数据库日志、关联缺失或未知格式将停止。</p><button>自动备份并校验副本</button></form><p id="status" role="status"></p><section id="result" hidden><h2>校验结果</h2><p id="summary"></p><dl id="identities"></dl><ul id="errors"></ul><p>恢复备份保持原样。验证副本需要隔离的 Wiki 配置与注册表进行后续重启验证；此处完成不代表获准原库迁移。</p><button id="download">下载结果报告</button></section><script type="module" src="/backup.js"></script><p><a href="/migration">进入验证副本单文件迁移</a></p></main></body></html>
