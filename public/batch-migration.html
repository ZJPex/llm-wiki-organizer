<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>批量目录迁移</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/migration">返回单文件迁移</a> · <a href="/original">审核原库执行</a><h1>批量目录迁移</h1><p>导入已确认的目录演化方案，或逐项填写明确的新旧路径。目录编号沿用审核方案；不依据相同内容猜测身份。</p><form id="batch"><label>完整备份报告路径<input name="reportPath" required></label><label>导入已确认目录方案<input id="evolution" type="file" accept=".json"></label><table><thead><tr><th>纳入</th><th>旧路径</th><th>新路径</th><th>状态</th></tr></thead><tbody id="rows"></tbody></table><button type="button" id="add">添加文件映射</button><label><input type="checkbox" name="writersPaused" required>全部外部写入已暂停</label><button>重新计算并冻结方案</button></form><p id="status" role="status"></p><section id="review" hidden><h2>审核可执行范围</h2><p id="summary"></p><ul id="changes"></ul><label><input type="checkbox" id="approve">确认执行可执行项；已排除和不安全项目保持原位</label><button id="execute">执行验证副本批次</button><button id="download">下载完整冻结预览</button></section><section id="results" hidden><h2>逐项执行结果</h2><p id="result-summary"></p><ul id="result-items"></ul></section><script type="module" src="/batch-migration.js"></script></main></body></html>
