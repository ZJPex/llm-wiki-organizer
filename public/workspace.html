<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库整理工作台</title><link rel="stylesheet" href="/workspace.css"></head>
<body><aside><a class="brand" href="/">知识库整理</a><label>当前知识库<select id="library"><option value="">请先设置知识库</option></select></label><nav aria-label="主要导航"><button id="home-nav">任务首页</button><button id="settings-nav">知识库设置</button><a href="/recovery">恢复与报告</a><a href="/preflight">兼容检查</a></nav><h2>分类浏览</h2><nav id="categories" aria-label="分类导航"></nav></aside>
<main><header><p>分类浏览工作台</p><h1 id="title">整理任务</h1><p id="notice" role="status"></p><p id="error" role="alert"></p></header>
<section id="home"><div class="toolbar"><form id="start"><label>材料范围<select id="mode"><option value="inbox">收件箱 · 日常整理</option><option value="restructure">全部 Raw · 首次重构</option></select></label><button class="primary">创建整理任务</button></form><button id="refresh">刷新任务</button></div><p>选择已有任务继续分析或审核；执行记录和恢复入口保留在任务中。</p><div id="tasks"></div><button id="more" hidden>加载更多任务</button></section>
<section id="browse" hidden><p id="category-description"></p><div id="files"></div><button id="files-more" hidden>下一页材料</button></section>
<section id="settings" hidden><h2>保存知识库环境</h2><p>设置按知识库保存，重启后再次校验。模型只读复用 Wiki 的有效配置，不复制密钥。</p><form id="settings-form"><label>知识库绝对路径<input name="libraryPath" required placeholder="包含 raw/sources 和 .llm-wiki 的目录"></label><label>收件箱绝对路径<input name="sourceRoot" required></label><details open><summary>高级环境设置</summary><label>Wiki 源码绝对路径<input name="wikiSourcePath" required></label><label>Wiki 实际配置文件<input name="configPath" required></label><label>库外备份与产物目录<input name="artifactRoot" required></label><p>备份目录必须已存在，并与知识库、收件箱、源码和整理器状态目录隔离。每次执行仍使用独立目录，禁止覆盖。</p></details><button class="primary">校验并保存设置</button><button type="button" id="new-library">新增知识库</button></form></section>
<section id="task-workspace" hidden aria-label="当前整理任务"></section>
</main><script type="module" src="/workspace.js"></script></body></html>
