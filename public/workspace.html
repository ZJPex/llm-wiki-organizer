<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知识库整理工作台</title><link rel="stylesheet" href="/workspace.css"><link rel="stylesheet" href="/category-browser.css"></head>
<body>
<header class="app-header"><a class="brand" href="/"><span aria-hidden="true">▣</span>知识库整理</a><span id="page-label">任务首页</span></header>
<aside class="app-nav"><nav aria-label="主要导航"><button id="home-nav" aria-current="page"><span aria-hidden="true">▤</span>整理任务</button><button id="browse-nav"><span aria-hidden="true">▱</span>分类浏览</button><a href="/recovery"><span aria-hidden="true">↶</span>恢复与报告</a></nav><nav aria-label="环境设置"><button id="settings-nav"><span aria-hidden="true">⚙</span>知识库设置</button><a href="/preflight"><span aria-hidden="true">◇</span>兼容检查</a></nav></aside>
<main>
<div class="library-bar"><label for="library" class="sr-only">当前知识库</label><select id="library"><option value="">请先设置知识库</option></select><p id="notice" role="status">正在加载知识库…</p></div>
<p id="error" role="alert"></p>
<header class="page-heading"><div><h1 id="title">整理任务</h1><p id="home-intro">从收件箱开始整理，或继续已有任务</p></div><form id="start"><label for="mode" class="sr-only">材料范围</label><select id="mode"><option value="inbox">收件箱 · 日常整理</option><option value="restructure">全部 Raw · 首次重构</option></select><button class="primary" disabled>＋ 新建整理任务</button></form></header>
<section id="home" aria-label="整理任务"><div id="featured" aria-live="polite"></div><div class="section-heading"><h2>全部任务</h2><button id="refresh">↻ 刷新任务</button></div><div id="tasks" aria-live="polite"></div><button id="more" hidden>加载更多任务</button></section>
<section id="browse" hidden aria-label="分类浏览工作台"><aside id="category-panel" class="category-panel"><h2>分类目录</h2><p>按层级浏览材料</p><nav id="categories" aria-label="分类导航"></nav></aside><div id="category-content" class="category-content" aria-live="polite"></div></section>
<section id="settings" hidden><h2>保存知识库环境</h2><p>设置按知识库保存，重启后再次校验。模型只读复用 Wiki 的有效配置，不复制密钥。</p><form id="settings-form"><label>知识库绝对路径<input name="libraryPath" required placeholder="包含 raw/sources 和 .llm-wiki 的目录"></label><label>收件箱绝对路径<input name="sourceRoot" required></label><details open><summary>高级环境设置</summary><label>Wiki 源码绝对路径<input name="wikiSourcePath" required></label><label>Wiki 实际配置文件<input name="configPath" required></label><label>库外备份与产物目录<input name="artifactRoot" required></label><p>备份目录必须已存在，并与知识库、收件箱、源码和整理器状态目录隔离。每次执行仍使用独立目录，禁止覆盖。</p></details><button class="primary">校验并保存设置</button><button type="button" id="new-library">新增知识库</button></form></section>
<section id="task-workspace" hidden aria-label="当前整理任务"></section>
</main><script type="module" src="/workspace.js"></script></body></html>
