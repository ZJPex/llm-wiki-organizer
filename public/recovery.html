<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>失败现场与备份恢复</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/batch-migration">返回批量迁移</a><h1>失败现场与完整备份恢复</h1><p>恢复会先保留当前现场与新增内容，再从完整备份恢复。独立目录可保留迁移后的验证副本，适合原库执行前的恢复演练。</p><form id="plan"><label>迁移日志绝对路径<input name="journalPath" required></label><button id="inspect" type="button">查看已完成步骤与现场变化</button><label>恢复方式<select name="mode"><option value="new-directory">恢复到全新独立目录</option><option value="same-location">保留现场后恢复到原位置</option></select></label><label>独立恢复目录绝对路径<input name="destination"></label><label>现场保留目录绝对路径（留空自动创建）<input name="scenePath"></label><label><input name="writersPaused" type="checkbox" required>全部外部写入已暂停</label><button>生成恢复方案</button></form><p id="status" role="status"></p><section id="review" hidden><h2>审核恢复方案</h2><div id="details"></div><label><input id="approved" type="checkbox">已确认恢复位置、现场位置和保留的新增内容</label><button id="execute">执行或继续恢复</button></section><h2>进程重启后查询或继续</h2><label>恢复计划绝对路径<input id="recovery-path"></label><button id="query">查询磁盘结果</button><button id="resume">加载方案以继续恢复</button><section id="output" aria-live="polite"></section><script type="module" src="/recovery.js"></script></main></body></html>
