<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日常 Inbox 整理</title><link rel="stylesheet" href="/style.css"></head><body><main><nav><a href="/">整理入口</a> · <a href="/recovery">恢复与报告</a></nav><h1>日常 Inbox 整理</h1><p>手动选择一批材料，依次分析内容、确认名字、查找分类并审核归档。牵动历史时先完成备份、副本验证和恢复演练，再正式迁移历史，最后归档新增材料。</p><form id="create"><label>知识库绝对路径<input name="libraryPath" required></label><label>Inbox 绝对路径<input name="sourceRoot" required></label><label>已核验 Wiki 源码路径<input name="wikiSourcePath" required></label><label>Wiki 实际配置文件<input name="configPath" required></label><label>库外批次产物目录<input name="artifactRoot" required></label><button>建立手动批次</button></form><form id="resume"><label>已有批次编号<input name="batchId" required></label><button>读取进度</button></form><p id="error" role="alert"></p><section id="progress" aria-live="polite"></section><button id="analyze" disabled>分析下一组（最多 5 份）</button><section id="sources"></section><button id="next" disabled>下一页材料</button><section><h2>审核执行</h2><label><input type="checkbox" id="paused">已暂停 Wiki、同步盘及其他写入者</label><p>确认后的名称会保留。重名、来源变化或关联证据不足会停止相关操作，不覆盖文件。新增归档不主动入队，也不更改首次摄取设置。含本地图片或材料链接、或有未移动材料指向来源时，本版会明确停止并保留文件；HTTP 外链不受影响。</p><button id="prepare" disabled>冻结已选材料与历史依赖</button><section id="slice"></section><label><input type="checkbox" id="approved">已核对下列最终路径与历史影响，确认执行所选范围</label><button id="validate" disabled>验证副本并演练恢复</button><button id="original" disabled>准备正式执行审核</button><button id="apply" disabled>执行历史迁移与新增归档</button></section></main><script type="module" src="/inbox.js"></script></body></html>
