<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>验证副本单文件迁移</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/backup">返回完整备份</a><h1>验证副本单文件迁移</h1><p>先创建明确的新旧路径方案，审核后仅在独立验证副本执行。原库和恢复备份保持原样。</p><form id="plan"><label>已完成备份的报告绝对路径<input name="reportPath" required></label><label>旧路径<input name="oldPath" value="raw/sources/旧名称.md" required></label><label>新路径<input name="newPath" value="raw/sources/主题/新名称.md" required></label><label><input name="writersPaused" type="checkbox" required>全部外部写入已暂停</label><button>生成迁移方案</button></form><p id="status" role="status"></p><section id="review" hidden><h2>审核方案</h2><div id="details"></div><label><input id="approved" type="checkbox">我已审核新旧位置及受影响关联，确认只操作验证副本</label><button id="execute">执行并验证副本</button></section><section id="result" hidden><h2>执行报告</h2><div id="output"></div></section><script type="module" src="/migration.js"></script></main></body></html>
