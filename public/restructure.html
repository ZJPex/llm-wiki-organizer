<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次整体重构</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/">返回整理器</a><h1>首次整体重构</h1><p>先分析全部材料，审核分类树和代表材料，再逐批审核文件名与目标位置。空白、噪声及关联不明确的材料保留原处。</p><form id="create"><label>知识库绝对路径<input name="libraryPath" required></label><label>固定上游源码目录<input name="wikiSourcePath" required></label><label>Wiki 配置文件绝对路径<input name="configPath" required></label><label>备份与演练工作目录（现有库外目录）<input name="artifactRoot" required></label><button>创建首次重构批次</button></form><h2>继续已有批次</h2><label>批次编号<input id="batch-id"></label><button id="load">读取磁盘进度</button><p id="status" role="status"></p><section id="work" hidden><div id="summary"></div><h2>第一阶段：全体分析与分类树审核</h2><button id="analyze">分析下一组材料</button><button id="propose">生成全范围分类树</button><div id="tree"></div><button id="tree-next" hidden>下一页分类节点</button><label><input id="tree-approved" type="checkbox">已审核分类结构、查找理由与代表材料</label><button id="approve-tree">确认分类树</button><h2>第二阶段：逐批审核文件名与路径</h2><div id="sources"></div><button id="first-page">回到材料首页</button><button id="next-page" hidden>下一页材料</button><label><input id="paused" type="checkbox">Wiki、同步程序及其他外部写入已暂停</label><button id="prepare">为已审核材料准备完整备份与分批方案</button><div id="slice"></div><button id="cancel-slice">保留此分批现场并重新审核</button><label><input id="slice-approved" type="checkbox">已审核本批最终路径及受影响关联，允许副本验证和恢复演练</label><button id="validate">验证副本并演练恢复</button><button id="authorize">生成原库最终审核</button><label><input id="original-approved" type="checkbox">已核对三份数据和恢复演练，确认应用原库</label><button id="apply">应用原库</button></section><script type="module" src="/restructure.js"></script></main></body></html>
