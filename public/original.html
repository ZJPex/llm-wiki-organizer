<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>审核与执行原库方案</title><link rel="stylesheet" href="/style.css"></head><body><main><a href="/batch-migration">返回批量迁移</a> · <a href="/recovery">恢复现场</a><h1>原库执行</h1><p>使用已在验证副本成功执行的同一方案。选中项目须全部成功，并先完成独立目录恢复演练；任一原库内容或目录变化都会阻止执行。</p><form id="prepare"><label>冻结迁移计划绝对路径<input name="planManifestPath" required></label><label>验证副本成功迁移日志绝对路径<input name="validationJournalPath" required></label><label>独立目录恢复演练结果绝对路径<input name="recoveryReportPath" required></label><label><input name="writersPaused" type="checkbox" required>已暂停 Wiki、同步工具及其他全部外部写入</label><button>核验并生成原库审核方案</button></form><p id="status" role="status"></p><section id="review" hidden><h2>原库方案审核</h2><div id="details"></div><label><input id="approved" type="checkbox">已核对原库、恢复备份、验证副本以及全部选中项目</label><button id="execute">执行此原库方案</button></section><h2>查询持久化执行结果</h2><label>结果报告绝对路径<input id="result-path"></label><button id="query">查询结果</button><section id="output" aria-live="polite"></section><script type="module" src="/original.js"></script></main></body></html>
